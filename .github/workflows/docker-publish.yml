name: Build and Push Docker Image

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/**'

  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      manual_push:
        description: 'Set to "yes" to push tag :test image to GHCR for testing before merging to main'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:

  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          DOCKER_URI=hermes-webtop docker build -f ./docker/Dockerfile -t hermes-webtop:test ./docker
          
      - name: Test Docker image
        run: |
          CONTAINER_NAME="hermes-webtop-test"
          TIMEOUT=120

          # Start container with shm-size (required by webtop) and all service ports mapped
          docker run -d --name "$CONTAINER_NAME" \
            --shm-size=1gb \
            -p 3000:3000 \
            -p 8888:8888 \
            -p 7352:7352 \
            -p 20128:20128 \
            hermes-webtop:test

          # Wait for init scripts to complete (poll for known log markers)
          echo "Waiting for startup scripts to complete..."
          STARTED_AT=$(date +%s)
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - STARTED_AT))

            if [ "$ELAPSED" -gt "$TIMEOUT" ]; then
              echo "FAIL: Container did not finish init within ${TIMEOUT}s"
              docker logs "$CONTAINER_NAME" --tail 100
              docker kill "$CONTAINER_NAME" >/dev/null 2>&1 || true
              exit 1
            fi

            LOGS=$(docker logs "$CONTAINER_NAME" 2>&1)

            # Check for Hermes readiness (our A2 readiness probe)
            if echo "$LOGS" | grep -q "Dashboard ready after"; then
              echo "PASS: Hermes dashboard became healthy."
              break
            fi

            # If we see Hermes services started but no dashboard probe, that's OK too
            if echo "$LOGS" | grep -q "all hermes-agent services started and ready"; then
              echo "PASS: Hermes services reported ready."
              break
            fi

            sleep 5
          done

          # Quick sanity: container must still be running
          if ! docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" --format "{{.Names}}" | grep -q "$CONTAINER_NAME"; then
            echo "FAIL: Container stopped unexpectedly."
            docker logs "$CONTAINER_NAME" --tail 50
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            exit 1
          fi

          # Poll all service ports until all respond or timeout
          PORT_POLL_TIMEOUT=60
          POLL_STARTED_AT=$(date +%s)
          declare -A RESPONDED
          echo ""
          echo "=== Polling Service Ports (${PORT_POLL_TIMEOUT}s timeout) ==="

          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - POLL_STARTED_AT))

            if [ "$ELAPSED" -gt "$PORT_POLL_TIMEOUT" ]; then
              echo ""
              echo "→ FAIL: Port poll timeout after ${PORT_POLL_TIMEOUT}s — not all services responded"
              for pair in "3000:WebTop" "8888:CodeServer" "7352:ModelRelay" "20128:OmniRoute"; do
                PORT="${pair%%:*}"
                NAME="${pair##*:}"
                if [ "${RESPONDED[$PORT]}" != "true" ]; then
                  echo "  • $NAME (:$PORT) — ❌ never responded"
                fi
              done
              docker logs "$CONTAINER_NAME" --tail 50
              docker kill "$CONTAINER_NAME" >/dev/null 2>&1 || true
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              exit 1
            fi

            for pair in "3000:WebTop" "8888:CodeServer" "7352:ModelRelay" "20128:OmniRoute"; do
              PORT="${pair%%:*}"
              NAME="${pair##*:}"

              if [ "${RESPONDED[$PORT]}" = "true" ]; then
                continue
              fi

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://localhost:${PORT}" 2>/dev/null) || HTTP_CODE="000"
              HTTP_CODE=$(echo "$HTTP_CODE" | tr -d '[:space:]')

              if [ -n "$HTTP_CODE" ] && [ "$HTTP_CODE" != "000" ]; then
                echo "  $NAME (:$PORT) — ✅ HTTP ${HTTP_CODE} (${ELAPSED}s)"
                RESPONDED[$PORT]="true"
              fi
            done

            # Check if all ports responded
            ALL_RESPONDED=true
            for port in 3000 8888 7352 20128; do
              if [ "${RESPONDED[$port]}" != "true" ]; then
                ALL_RESPONDED=false
                break
              fi
            done

            if [ "$ALL_RESPONDED" = "true" ]; then
              echo ""
              echo "→ PASS: All service ports responded within ${ELAPSED}s"
              break
            fi

            sleep 5
          done

          echo ""
          echo "=== Running boot-time self-check validation ==="
          # Execute the self-check script inside the container.
          # We check the exit status. In headless CI, some warnings might be present,
          # but critical errors (exit code 2) must trigger build failure.
          if ! docker exec "$CONTAINER_NAME" self-check; then
            SELF_CHECK_STATUS=$?
            echo "Self-check exited with status: $SELF_CHECK_STATUS"
            if [ "$SELF_CHECK_STATUS" -eq 2 ]; then
              echo "FAIL: Self-check reported critical stack errors."
              docker exec "$CONTAINER_NAME" cat /tmp/health-report.json || true
              docker kill "$CONTAINER_NAME" >/dev/null 2>&1 || true
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              exit 2
            fi
            echo "Self-check warning caught (non-critical)."
          fi

          echo "=== Verified Health Report JSON ==="
          docker exec "$CONTAINER_NAME" cat /tmp/health-report.json | jq -r

          echo ""

          # Cleanup
          echo "Test complete. Stopping container..."
          docker kill "$CONTAINER_NAME" >/dev/null 2>&1 || true
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          echo "PASS: Docker image smoke test passed."
        
  push-to-ghcr:
    runs-on: ubuntu-latest
    # Run if on main branch, or if manual_push is yes from workflow_dispatch
    if: >-
      (github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.manual_push == 'yes')
    needs: build-test
    permissions:
      contents: read
      packages: write

    steps:
      # --- Free space becos the docker build is large ---
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        # 👆 This is needed ARM emulation on AMD64 runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # 👆 This is need for QEMU to work

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set IMAGE_TAG for build-test
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.manual_push }}" = "yes" ]; then
            echo "IMAGE_TAG=test" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.LOWERCASE_REPO }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}