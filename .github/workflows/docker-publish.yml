name: Build and Push Docker Image

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/**'

  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      manual_push:
        description: 'Set to "yes" to push tag :test image to GHCR for testing before merging to main'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:

  build-test:
    runs-on: ubuntu-latest
    
    steps:
      # --- Free space becos the docker build is large ---
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          DOCKER_URI=hermes-webtop docker build -f ./docker/Dockerfile -t hermes-webtop:test ./docker
          
      - name: Test Docker image
        run: |
          CONTAINER_NAME="hermes-webtop"

          # Start container like how it is used - DevProd Parity
          NO_LOGS=1 DOCKER_URI=hermes-webtop:test make start

          # Wait for init scripts to finish (port 9119 responding = start-hermes.sh done)
          echo "=== Waiting for Hermes to become healthy ==="
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER_NAME" curl -s -o /dev/null -w "%{http_code}" http://localhost:9119 2>/dev/null | grep -q "200\|302\|401"; then
              echo "Hermes ready after $((i * 5)) seconds."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "WARNING: Hermes did not respond within 150 seconds."
            fi
            sleep 5
          done

          # Run self-check (it has its own 120s polling loop for all ports)
          echo "=== Running boot-time self-check validation ==="
          # Execute the self-check script inside the container.
          # We check the exit status. In headless CI, some warnings might be present,
          # but critical errors (exit code 2) must trigger build failure.
             
          # Disable exit-on-error and capture the exit status of the self-check script
          set +e    
          docker exec -u abc "$CONTAINER_NAME" self-check
          SELF_CHECK_STATUS=$?
          set -e

          echo "\n\nSelf-check exited with status: $SELF_CHECK_STATUS"
          
          # Only fail on critical errors (exit_code=2), not warnings (exit_code=1)
          if [ "${SELF_CHECK_STATUS}" -eq 2 ]; then
            echo "FAIL: Docker image smoke test failed; Collecting logs."
            mkdir -p /tmp/failure-logs

            # Capture docker-compose startup logs without color codes
            docker compose logs --no-color > /tmp/failure-logs/docker-compose.log
  
            # Service logs (written to /tmp by start scripts)
            docker exec "$CONTAINER_NAME" sh -c 'cd /tmp && tar cf - *.log' | tar xf - -C /tmp/failure-logs/

            # Hermes logs
            docker exec "$CONTAINER_NAME" sh -c 'cd $HOME/.hermes/logs && tar cf - *.log' | tar xf - -C /tmp/failure-logs/

            ls -la /tmp/failure-logs/

            exit 1
          elif [ "${SELF_CHECK_STATUS}" -eq 1 ]; then
            echo "PASS: Docker image smoke test passed (warnings only, no critical errors)."
            exit 0
          else
            echo "PASS: Docker image smoke test passed."
            exit 0
          fi         

      - name: Mnemon Integration Test
        run: |
          set -euo pipefail
          CONTAINER_NAME="hermes-webtop"
          TEST_NAME="ci-mnemon-$(date +%s)-$$"
          echo "=== Mnemon Integration Test: $TEST_NAME ==="

          echo "[1/3] Hermes remembers via mnemon_remember..."
          timeout 60 docker exec -u abc "$CONTAINER_NAME" \
            hermes chat -q "my name is $TEST_NAME, remember this in mnemon" \
            || { echo "FAIL: Hermes failed"; exit 1; }

          echo "[2/3] mnemon recall via CLI..."
          docker exec -u abc "$CONTAINER_NAME" \
            mnemon recall "$TEST_NAME" --limit 5 2>&1 | grep -q "$TEST_NAME" \
            || { echo "FAIL: mnemon recall did not find $TEST_NAME"; exit 1; }

          echo "[3/3] Claude retrieves via mnemon..."
          CLAUDE_OUTPUT=$(timeout 60 docker exec -u abc "$CONTAINER_NAME" \
            /config/.local/bin/claude --dangerously-skip-permissions -p \
            "Use mnemon recall to find my name. Reply with ONLY the name." 2>&1) || true
          echo "Claude: $CLAUDE_OUTPUT"
          echo "$CLAUDE_OUTPUT" | grep -q "$TEST_NAME" \
            || { echo "FAIL: Claude did not return $TEST_NAME"; }

          echo "=== ALL MNEMON CHECKS PASSED ==="

      # ── Collect logs on failure ──────────────────────────────────────
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: /tmp/failure-logs/
          if-no-files-found: warn
         
  push-to-ghcr:
    runs-on: ubuntu-latest
    # Run if on main branch, or if manual_push is yes from workflow_dispatch
    if: >-
      (github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.manual_push == 'yes')
    needs: build-test
    permissions:
      contents: read
      packages: write

    steps:
      # --- Free space becos the docker build is large ---
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
     
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        # 👆 This is needed ARM emulation on AMD64 runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # 👆 This is need for QEMU to work

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set IMAGE_TAG for build-test
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.manual_push }}" = "yes" ]; then
            echo "IMAGE_TAG=test" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.LOWERCASE_REPO }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
