name: Build and Push Docker Image

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/**'

  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      manual_push:
        description: 'Set to "yes" to push tag :test image to GHCR for testing before merging to main'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

jobs:

  build-test:
    runs-on: ubuntu-latest
    
    steps:
      # --- Free space becos the docker build is large ---
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          DOCKER_URI=hermes-webtop docker build -f ./docker/Dockerfile -t hermes-webtop:test ./docker
          
      - name: Test Docker image
        run: |
          CONTAINER_NAME="hermes-webtop-test"
          TIMEOUT=240

          # Start container with shm-size (required by webtop) and all service ports mapped
          docker run -d --name "$CONTAINER_NAME" \
            --shm-size=1gb \
            -p 3000:3000 \
            -p 8888:8888 \
            -p 7352:7352 \
            -p 20128:20128 \
            -p 9119:9119 \
            hermes-webtop:test

          # Wait for init scripts to complete (poll for known log markers)
          echo "Waiting for startup scripts to complete..."
          STARTED_AT=$(date +%s)
          while true; do
            NOW=$(date +%s)
            ELAPSED=$((NOW - STARTED_AT))

            if [ "$ELAPSED" -gt "$TIMEOUT" ]; then
              echo "FAIL: Container did not finish init within ${TIMEOUT}s"
              break              
            fi

            LOGS=$(docker logs "$CONTAINER_NAME" 2>&1)

            # Check for Hermes readiness (our A2 readiness probe)
            if echo "$LOGS" | grep -q "Dashboard ready after"; then
              echo "PASS: Hermes dashboard became healthy."
              break
            fi

          done

          echo ""
          echo "=== Running boot-time self-check validation ==="
          # Execute the self-check script inside the container.
          # We check the exit status. In headless CI, some warnings might be present,
          # but critical errors (exit code 2) must trigger build failure.
          docker exec "$CONTAINER_NAME" self-check
          SELF_CHECK_STATUS=$?
          docker exec "$CONTAINER_NAME" cat /tmp/health-report.json | jq -r
          echo "Self-check exited with status: $SELF_CHECK_STATUS"
          
          if [ "${SELF_CHECK_STATUS}" -eq 0 ]; then
            echo "PASS: Docker image smoke test passed."
          else
            # Collect logs
            echo "FAIL: Docker image smoke test falled; Collecting logs."
            mkdir -p /tmp/failure-logs
  
            # Service logs (written to /tmp by start scripts)
            docker cp "$CONTAINER_NAME:/tmp/modelrelay.log"   /tmp/failure-logs/ 
            docker cp "$CONTAINER_NAME:/tmp/omniroute.log"    /tmp/failure-logs/ 
            docker cp "$CONTAINER_NAME:/tmp/ollama.log"       /tmp/failure-logs/ 2>/dev/null || true
            docker cp "$CONTAINER_NAME:/tmp/ollama-pull.log"  /tmp/failure-logs/ 2>/dev/null || true
  
            # Hermes logs
            docker cp "$CONTAINER_NAME:/home/vscode/.hermes/logs/gateway.log"   /tmp/failure-logs/ 2>/dev/null || true
            docker cp "$CONTAINER_NAME:/home/vscode/.hermes/logs/dashboard.log" /tmp/failure-logs/     

            ls -la /tmp/failure-logs/
            exit 1
          fi          
      # ── Collect logs on failure ──────────────────────────────────────
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: /tmp/failure-logs/
          if-no-files-found: warn
          
  push-to-ghcr:
    runs-on: ubuntu-latest
    # Run if on main branch, or if manual_push is yes from workflow_dispatch
    if: >-
      (github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.manual_push == 'yes')
    needs: build-test
    permissions:
      contents: read
      packages: write

    steps:
      # --- Free space becos the docker build is large ---
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        # 👆 This is needed ARM emulation on AMD64 runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # 👆 This is need for QEMU to work

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set IMAGE_TAG for build-test
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.manual_push }}" = "yes" ]; then
            echo "IMAGE_TAG=test" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.LOWERCASE_REPO }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.LOWERCASE_REPO }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
